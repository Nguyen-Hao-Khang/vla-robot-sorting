name: Task
description: A work item from docs/project-plan.md
title: "<type>(<scope>): <summary>"
labels: ["task"]
body:
  - type: input
    id: item
    attributes:
      label: Plan item
      description: ID from docs/project-plan.md, for example 1.3
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - "1. Simulation data and model selection"
        - "2. Training and simulated evaluation"
        - "3. Real-robot integration"
        - "4. Real-robot experiments"
        - "5. Write-up and release"
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
    validations:
      required: true
