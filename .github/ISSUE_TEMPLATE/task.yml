name: Đầu việc
description: Một đầu việc trong kế hoạch dự án
title: "<type>(<scope>): <summary>"
body:
  - type: dropdown
    id: phase
    attributes:
      label: Giai đoạn
      options:
        - "1. Dữ liệu mô phỏng và chọn mô hình"
        - "2. Huấn luyện và đánh giá trong mô phỏng"
        - "3. Tích hợp robot thật"
        - "4. Thực nghiệm trên robot thật"
        - "5. Hoàn thiện báo cáo"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Mô tả
      description: Việc cần làm và kết quả bàn giao.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Tiêu chí hoàn thành
      description: Các điều kiện kiểm tra được.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: requirement
    attributes:
      label: Yêu cầu đề tài
      multiple: true
      options:
        - "1. Tổng quan VLA và cơ chế lệnh → hành động"
        - "2. Phần cứng, giao thức điều khiển, hệ thu ảnh"
        - "3. Triển khai và tinh chỉnh VLA"
        - "4. Ứng dụng phân loại hoàn chỉnh"
        - "5. Đánh giá"
  - type: textarea
    id: notes
    attributes:
      label: Ghi chú
      description: Phụ thuộc, liên kết, rủi ro.
