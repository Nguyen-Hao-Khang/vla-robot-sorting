name: Feature request
description: Propose a new capability or a change to an existing one
title: "feat(<scope>): <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or limiting today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and how you would verify it
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
