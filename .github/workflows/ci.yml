name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv sync --dev --extra native-camera-replay
          uv pip install opencv-python-headless
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
