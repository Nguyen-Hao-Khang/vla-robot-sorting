name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            exp
            chore
          scopes: |
            sim
            data
            train
            eval
            robot
            safety
            report
            docs
            ci
          requireScope: false
          subjectPattern: ^[a-z].{0,71}$
          subjectPatternError: Summary must start with a lowercase letter and be at most 72 characters.
