[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vla-robot-sorting"
version = "0.1.0"
description = "Language-conditioned object sorting with a small vision-language-action model on the Panthera-HT arm"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Nguyen Hao Khang" }
]
dependencies = []

[dependency-groups]
dev = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<6",
  "Pillow>=10,<13",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vla_robot_sorting"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
markers = [
  "simulator: tests requiring a simulator/runtime not guaranteed on Windows",
  "network: tests requiring external network/API access",
]

[tool.ruff]
extend-exclude = ["notebooks"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
